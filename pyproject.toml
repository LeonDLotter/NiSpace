[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "nispace"
dynamic = ["version"]
authors = [
    {name = "Leon D. Lotter", email = "leondlotter@gmail.com"},
]
maintainers = [
    {name = "Leon D. Lotter", email = "leondlotter@gmail.com"},
]
description = "Neuroimaging Spatial Colocalization Environment"
readme = "README.rst"
requires-python = ">=3.11"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "tqdm>=4.66.4",
    "joblib>=1.3.0",
    "requests>=2.32.3",
    "colorlog>=6.8.2",
    "dill>=0.4.0",
    "blosc>=1.11.3",
    "numba>=0.60.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "nibabel>=5.2.0",
    "nilearn>=0.13.0",
    "neuromaps>=0.0.7",
    "templateflow>=24.0.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.2",
    "scikit-learn>=1.6.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
opt = [
    "brainsmash>=0.10.0",
    "nitransforms>=24.0.0",
    "nimare",
]
data = [
    "abagen",
    "nimare",
    "pyreadr",
    "pyyaml",
    "nitransforms>=24.0.0",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pingouin>=0.6",
]

[project.urls]
Repository = "https://github.com/LeonDLotter/NiSpace"

[tool.setuptools.packages]
# only the nispace package; without "include", namespace discovery also packs docs/, poster/, logo/, ...
find = {include = ["nispace*"]}

[tool.setuptools.package-data]
nispace = ["datalib/*", "datalib/**/*"]

[tool.setuptools_scm]
version_file = "nispace/_version.py"
fallback_version = "0.0.0+unknown"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs ~/projects/nispace-data and/or network access; excluded by default, run explicitly with -m integration",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["nispace"]
omit = ["nispace/_version.py"]