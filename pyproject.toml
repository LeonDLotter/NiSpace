[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "nispace"
dynamic = ["version"]
authors = [
    {name = "Leon D. Lotter", email = "leondlotter@gmail.com"},
]
maintainers = [
    {name = "Leon D. Lotter", email = "leondlotter@gmail.com"},
]
description = "Neuroimaging Spatial Colocalization Environment"
readme = "README.rst"
requires-python = ">=3.9"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "tqdm>=4.66.4",
    "joblib>=1.2.0",
    "requests>=2.32.3",
    "colorlog>=6.8.2",
    "dill>=0.4.0",
    "blosc>=1.11.3",
    "numba>=0.58.0",
    "numpy>=1.23.0,<=2.3.0",
    "pandas>=2.0.0",
    "nibabel>=4.0.0",
    "nilearn>=0.10.0,<=0.12.1",
    "neuromaps @ git+https://github.com/netneurolab/neuromaps@f0ed67c44d633061b93c6d337a1b233f6895c408",
    "templateflow>=24.0.0",
    "scipy>=1.6.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.5.0",
    "neurocombat>=0.2.12",
    "neuroHarmonize>=2.4.5",
    "matplotlib>=3.6.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
opt = [
    "brainsmash >=0.10.0",
    "factor-analyzer",
    "nitransforms>=24.0.0",
]
data = [
    "abagen",
    "nimare",
    "pyreadr",
    "pyyaml",
    "nitransforms>=24.0.0",
]

[project.urls]
Repository = "https://github.com/LeonDLotter/NiSpace"

[tool.setuptools.packages]
find = {}

[tool.setuptools.package-data]
nispace = ["datalib/*", "datalib/**/*"]

[tool.setuptools_scm]
version_file = "nispace/_version.py"
fallback_version = "0.0.0+unknown"