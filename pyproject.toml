[build-system]
requires = ["setuptools", "versioneer[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "nispace"
version = "0.0.1"  # This will be overridden by versioneer
authors = [
    {name = "Leon D. Lotter", email = "leondlotter@gmail.com"},
]
maintainers = [
    {name = "Leon D. Lotter", email = "leondlotter@gmail.com"},
]
description = "Neuroimaging Spatial Colocalization Environment"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "tqdm>=4.66.4",
    "joblib>=1.2.0",
    "requests>=2.32.3",
    "colorlog>=6.8.2",
    "dill>=0.4.0",
    "blosc>=1.11.3",
    "numba>=0.58.0",
    "numpy>=1.23.0",
    "pandas>=2.0.0",
    "nibabel>=4.0.0",
    "nilearn>=0.10.0,<=0.12.1",
    "neuromaps @ git+https://github.com/netneurolab/neuromaps@f0ed67c44d633061b93c6d337a1b233f6895c408",
    "scipy>=1.6.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.5.0",
    "neurocombat>=0.2.12",
    "neuroHarmonize>=2.4.5",
    "matplotlib>=3.6.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
opt = [
    "brainsmash >=0.10.0",
    "factor-analyzer",
]

[project.urls]
Repository = "https://github.com/LeonDLotter/NiSpace"

[tool.setuptools.packages]
find = {}

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "nispace/_version.py"
versionfile_build = "nispace/_version.py"
tag_prefix = "v"
parentdir_prefix = ""