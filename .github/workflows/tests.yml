name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # one Python version failing must not cancel the others
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with test extras
        run: pip install -e ".[test]"

      - name: Run pytest with coverage
        # pytest-xdist (in [test] extras); loadfile keeps each test file on one worker
        run: pytest -n auto --dist loadfile --cov=nispace --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  pytest-lowest:
    # the lowest versions of the direct dependencies that pyproject.toml allows, on the
    # lowest supported Python: keeps the declared minimum versions honest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package with the lowest allowed direct dependencies
        run: |
          pip install uv
          uv pip install --system --resolution lowest-direct -e ".[test]"

      - name: Run pytest
        run: pytest -n auto --dist loadfile
